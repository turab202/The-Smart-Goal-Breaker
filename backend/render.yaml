services:
  - type: web
    name: smart-goal-breaker-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smart_goals
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
